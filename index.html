<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototipos inteligentes para el entorno urbano</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
</head>

<body>
    <a-scene renderer="colorManagement: true">

        <!-- Carga del modelo 3D del museo -->
        <a-assets>
            <a-asset-item id="museo" src="museo.glb"></a-asset-item>
            <a-asset-item id="casa1" src="casa1.glb"></a-asset-item>
            <a-asset-item id="garaje" src="garaje.glb"></a-asset-item>
            <a-asset-item id="farola" src="farola.glb"></a-asset-item>
            <a-asset-item id="Barrera" src="Barrera.glb"></a-asset-item>
            
            <img id="cartel" src="cartel.jpg">
        </a-assets>

        <!-- Museo CTIF -->
        <a-entity 
            id="sala-ctif"
            gltf-model="#museo"
            position="0 0 0"
            rotation="0 0 0"
            scale="2 2 3">
        </a-entity>

        <!-- Luces suaves -->
        <a-light 
            type="ambient" 
            color="#FFFFFF" 
            intensity="0.5">
        </a-light>

        <a-light 
            type="directional" 
            position="0 5 4" 
            intensity="0.6" 
            color="#FFFFFF">
        </a-light>

        <a-light 
            type="point" 
            position="0 3 0" 
            intensity="0.35" 
            distance="8" 
            decay="2" 
            color="#FFFFFF">
        </a-light>

        <!-- Cámara dentro del museo -->
        <a-entity 
            id="camara"
            camera
            look-controls
            wasd-controls="acceleration: 12"
            position="0 1.6 2.5"
            rotation="0 0 0">
        </a-entity>

        <!-- 
            TODO LO QUE VA DENTRO DEL MUSEO.
            Si no queda centrado, cambia SOLO position de este grupo.
        -->
       
            <!-- casa con sensor -->
            <a-entity gltf-model="#casa1" rotation="0 90 0" position="-11 0 -5" scale="0.7 0.7 0.6"> </a-entity>
            <!-- Garaje -->
            <a-entity gltf-model="#garaje" rotation="0 0 0" position="-11 0 2" scale="0.8 0.8 0.7"> </a-entity>
            <!-- Farola -->
            <a-entity gltf-model="#farola" rotation="0 0 0" position="-5 0 -8.5" scale="0.8 0.9 0.8"> </a-entity>
            <!-- Barrera -->
            <a-entity gltf-model="#Barrera" rotation="0 0 0" position="10 0 -8.5" scale="0.8 0.9 0.8"> </a-entity>
            <!-- cartel -->
            <a-image src="#cartel" rotation="0 -90 0" position="11 3.5 -3" width="4.75" height="6.25">  </a-image>

        <!-- Fondo exterior -->
        <a-sky color="#DDEEFF"></a-sky>

    </a-scene>
</body>
</html>
